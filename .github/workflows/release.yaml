---
name: Release Charts

on:
  push:
    branches:
      - master
    paths:
      - 'charts/**'
  # Allows re-running a release without touching a chart.
  workflow_dispatch:

# Never release two commits at once — both would rewrite index.yaml.
concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create git tags + GitHub releases, push to gh-pages
      packages: write   # push OCI artifacts to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Publishes one GitHub release per chart version (tagged <chart>-<version>)
      # and refreshes index.yaml on the gh-pages branch. Charts whose version was
      # already released are skipped, so bumping Chart.yaml version is what
      # triggers a release.
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Mirror every chart to the OCI registry so consumers can use either
      # `helm repo add` (gh-pages) or `oci://ghcr.io/...` directly.
      - name: Push charts to GHCR (OCI)
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          mkdir -p .oci-packages

          for chart_dir in charts/*/; do
            [[ -f "${chart_dir}Chart.yaml" ]] || continue
            name="$(helm show chart "$chart_dir" | yq -r '.name')"
            version="$(helm show chart "$chart_dir" | yq -r '.version')"

            if helm show chart "oci://ghcr.io/${owner}/charts/${name}" \
                 --version "$version" >/dev/null 2>&1; then
              echo "==> ${name}:${version} already in GHCR, skipping"
              continue
            fi

            echo "==> Packaging and pushing ${name}:${version}"
            helm dependency update "$chart_dir"
            helm package "$chart_dir" --destination .oci-packages
            helm push ".oci-packages/${name}-${version}.tgz" \
              "oci://ghcr.io/${owner}/charts"
          done
