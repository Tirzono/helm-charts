---
# The application image. One image runs every process in this chart — the web
# server, every entry in extraProcesses, and the migration Job — each with a
# different command, which is how Django apps are normally packaged.
#
# The default is a placeholder so the chart renders and installs out of the box.
# Every real deployment overrides repository and tag.
image:
  repository: python
  tag: "3.12-alpine"
  pullPolicy: IfNotPresent

# Secrets used to pull the image, e.g. a GHCR pull secret.
# imagePullSecrets:
#   - name: ghcr-docker-config
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # If not set and create is true, a name is generated from the fullname template.
  name: ""

# Kept on every Deployment in the chart.
revisionHistoryLimit: 3

# ---------------------------------------------------------------------------
# Shared defaults
#
# These apply to the web Deployment, every extra process and the migration Job.
# Any of them can be overridden per process — see `web` and `extraProcesses`.
# ---------------------------------------------------------------------------

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000
  # runAsGroup: 1000
  # fsGroup: 1000
  # seccompProfile:
  #   type: RuntimeDefault

securityContext: {}
  # allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #     - ALL
  # readOnlyRootFilesystem: true

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Extra volumes and mounts added to every process.
volumes: []
volumeMounts: []

# Environment added to every process. Entries are plain container env, so
# valueFrom works — which is how connections other than Postgres arrive:
#
# env:
#   - name: RABBITMQ_URL
#     valueFrom:
#       secretKeyRef:
#         name: rabbitmqcluster-myapp-default-user
#         key: connection_string
#   - name: REDIS_URL
#     value: redis://redis.myapp.svc.cluster.local:6379/0
env: []

# Non-secret settings, rendered into a ConfigMap and mounted with envFrom.
# Values are quoted, so numbers and booleans arrive as strings — which is what
# Django's env parsing expects anyway.
#
# config:
#   DJANGO_SETTINGS_MODULE: config.settings.production
#   DJANGO_ALLOWED_HOSTS: app.example.com
config: {}

# Files mounted into containers rather than loaded as env — a proxy config, a
# logging config. Each key becomes a key in a ConfigMap named
# <fullname>-files, which a volume then mounts. Contents are run through `tpl`,
# so they can reference release values.
#
# configFiles:
#   Caddyfile: |
#     :8080 {
#       reverse_proxy localhost:8000
#     }
configFiles: {}

# Secrets that already exist in the namespace, wired up with envFrom.
# This is the only secret mode the chart supports: the chart never creates or
# generates a Secret, it only references what an operator (or CloudNativePG,
# or a secrets controller) has already put in the namespace.
#
# Later entries win over earlier ones, and all of them win over `config`.
#
# existingSecrets:
#   - myapp-secrets
existingSecrets: []

# ConfigMaps that already exist in the namespace, wired up with envFrom.
existingConfigMaps: []

# ---------------------------------------------------------------------------
# Database
#
# Postgres is always external — managed by CloudNativePG, never by this chart.
# The chart only consumes a connection: a host and database name from values,
# credentials from a Secret that already exists.
#
# The defaults for `keys` match the secret CloudNativePG generates for a
# cluster's app user (`<cluster>-app`), so pointing at that secret is all that
# is normally needed.
#
# When existingSecret is empty no database env is rendered at all, which keeps
# the chart usable for an app that gets its DATABASE_URL some other way.
# ---------------------------------------------------------------------------
database:
  # Name of the existing Secret holding the credentials.
  existingSecret: ""

  # Host to connect to. Required when existingSecret is set. Not read from the
  # secret, because it is often deliberately different from the value in there
  # — a CNPG Pooler (pgbouncer) service rather than the cluster's own service.
  host: ""

  # Optional literal overrides. When empty, these are read from the secret
  # using the keys below.
  port: ""
  name: ""

  # Keys within existingSecret.
  keys:
    username: username
    password: password
    database: dbname
    port: port

  # Rendered env: DATABASE_HOST, DATABASE_PORT, DATABASE_NAME, DATABASE_USER,
  # DATABASE_PASSWORD, and DATABASE_URL assembled from them. The assembled URL
  # does not URL-encode the password; CNPG-generated passwords are safe, a
  # hand-written one with reserved characters would not be.
  urlEnvVar: DATABASE_URL
  urlScheme: postgresql

# ---------------------------------------------------------------------------
# Web process
# ---------------------------------------------------------------------------
web:
  replicas: 1

  # Command and args for the container. Leave empty to use the image's own
  # entrypoint, e.g. an image whose default command already starts gunicorn.
  #
  # command: ["gunicorn", "config.wsgi", "--bind", "0.0.0.0:8000"]
  command: []
  args: []

  # Port the application listens on. The Service targets this port.
  containerPort: 8000

  strategy: {}
    # type: RollingUpdate

  # Probes are off by default: a base chart cannot know whether an app has a
  # health endpoint, and a probe pointed at a URL that 404s is worse than none.
  # A tcpSocket probe works for any app that binds a port; an httpGet against a
  # real health view is better where one exists.
  livenessProbe: {}
    # tcpSocket:
    #   port: http
    # initialDelaySeconds: 10
  readinessProbe: {}
    # httpGet:
    #   path: /healthz/
    #   port: http
    # initialDelaySeconds: 5
  startupProbe: {}

  # Sidecars, written as plain container specs. The common case is a proxy in
  # front of the app to serve static and media files, which is a deployment
  # concern rather than something the chart should model:
  #
  # extraContainers:
  #   - name: proxy
  #     image: caddy:2.10.2-alpine
  #     ports:
  #       - name: proxy
  #         containerPort: 8080
  #         protocol: TCP
  #     volumeMounts:
  #       - name: proxy-config
  #         mountPath: /etc/caddy/Caddyfile
  #         subPath: Caddyfile
  #
  # With a sidecar in front, point service.targetPort at the sidecar's port and
  # leave containerPort as the port the application itself listens on.
  #
  # extraContainers, volumes and volumeMounts are run through `tpl`, so they
  # can name chart-generated objects — see examples/caddy-static-values.yaml.
  extraContainers: []

  # Overrides of the shared defaults above. Anything left out falls back.
  resources: {}
  env: []
  podAnnotations: {}
  podLabels: {}
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Extra processes
#
# One Deployment per entry, all running the same image with a different
# command. What the process *is* — a task worker, a scheduler, a queue
# consumer, a dashboard — is an application concern, not a chart concern.
#
# Only `name` and `command` are required; everything else falls back to the
# shared defaults. An empty list renders nothing.
#
# extraProcesses:
#   - name: worker
#     command: ["python", "manage.py", "worker"]
#     replicas: 2
#     resources:
#       requests:
#         cpu: 200m
#         memory: 512Mi
#   - name: scheduler
#     command: ["python", "manage.py", "scheduler"]
#     replicas: 1
#     # Schedulers usually must not overlap with themselves during a rollout.
#     strategy:
#       type: Recreate
#   - name: dashboard
#     command: ["celery", "flower"]
#     # A process may declare ports; the chart does not create a Service for
#     # it, so reach it with a port-forward or add one alongside the release.
#     ports:
#       - name: http
#         containerPort: 5555
#         protocol: TCP
extraProcesses: []

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  # Named port on the web pod to route to. `http` is the application's own
  # port; point this at a sidecar's port name when one fronts the app.
  targetPort: http
  annotations: {}

# ---------------------------------------------------------------------------
# Ingress
#
# Rendered only when enabled. With ingress disabled and service.type set to
# LoadBalancer, the chart works on a cluster with no ingress controller at all.
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  # e.g. traefik, nginx, or a Cloudflare Tunnel controller's class.
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: django.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - hosts:
    #     - django.local
    #   secretName: django-tls

# ---------------------------------------------------------------------------
# Migrations
#
# `python manage.py migrate` as a Helm pre-install/pre-upgrade hook, so it
# finishes before the Deployments roll. Argo CD translates these hook
# annotations into a PreSync hook, so the same chart behaves the same way
# under `helm install` and under Argo.
#
# Set enabled to false to run migrations by hand — worth doing when a
# migration is long enough that blocking the release is the bigger problem.
# ---------------------------------------------------------------------------
migrations:
  enabled: true

  # An app that needs a second step after migrate — a task framework that
  # manages its own schema, a data backfill — chains it here rather than
  # getting its own template:
  #   command: ["sh", "-c", "python manage.py migrate && python manage.py <step>"]
  command: ["python", "manage.py", "migrate"]
  args: []

  backoffLimit: 3
  # Deletes the Job once it succeeds. A failed Job is kept so its logs can be
  # read; the next release deletes it before creating the new one.
  activeDeadlineSeconds: 600

  # Overrides of the shared defaults above.
  resources: {}
  env: []
  podAnnotations: {}
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Renders a `helm test` Pod that fetches the web Service. Turn off for an app
# whose root URL needs authentication.
tests:
  enabled: true
