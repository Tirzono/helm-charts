{{- /*
The web container always declares `http`, the port the Service targets. Anything
in web.extraPorts comes after it -- a metrics port for a PodMonitor to find by
name is the usual case. It is a separate key rather than a passthrough of
web.ports so that the one port the chart relies on cannot be left out or
renamed by a values file.
*/}}
{{- $web := deepCopy .Values.web }}
{{- $http := dict "name" "http" "containerPort" (.Values.web.containerPort | int) "protocol" "TCP" }}
{{- $_ := set $web "ports" (concat (list $http) (.Values.web.extraPorts | default list)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "django.fullname" . }}-web
  labels:
    {{- include "django.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
  {{- with (merge (dict) (.Values.web.annotations | default dict) (.Values.annotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.web.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "django.componentSelectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      {{- include "django.podMetadata" (dict "root" . "component" "web" "process" $web) | trim | nindent 6 }}
    spec:
      {{- include "django.podSpec" (dict "root" . "component" "web" "process" $web) | trim | nindent 6 }}
