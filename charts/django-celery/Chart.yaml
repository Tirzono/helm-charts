---
apiVersion: v2
name: django-celery
description: Django with a Celery stack — worker, Beat and optional Flower — on top of the base Django chart, backed by an external Postgres and broker
type: application

# version is the chart version. Bump this on every change — the release
# workflow only publishes versions that do not exist yet.
version: 0.1.0

# appVersion tracks the chart's own generation; the application image comes
# from values and differs per app.
appVersion: "1.0.0"

# Everything except the celery block is rendered by the library chart, shared
# with charts/django and charts/django-procrastinate.
dependencies:
  - name: django-common
    version: 0.1.0
    repository: file://../django-common

home: https://github.com/tirzono/helm-charts
sources:
  - https://github.com/tirzono/helm-charts/tree/master/charts/django-celery
keywords:
  - django
  - celery
  - python
maintainers:
  - name: tirzono
    url: https://github.com/tirzono
