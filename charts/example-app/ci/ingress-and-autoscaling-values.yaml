---
# Renders the optional Ingress and HPA templates so they stay covered by CI.
resources:
  requests:
    cpu: 10m
    memory: 32Mi

ingress:
  enabled: true
  hosts:
    - host: example-app.ci.local
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
