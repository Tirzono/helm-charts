---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "example-app.fullname" . }}-test-connection"
  labels:
    {{- include "example-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "example-app.fullname" . }}:{{ .Values.service.port }}']
