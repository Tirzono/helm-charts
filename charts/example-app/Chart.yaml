---
apiVersion: v2
name: example-app
description: A starter chart showing the layout every chart in this repo follows
type: application

# version is the chart version. Bump this on every change — the release
# workflow only publishes versions that do not exist yet.
version: 0.1.0

# appVersion is the version of the application this chart deploys.
appVersion: "1.27-alpine"

home: https://github.com/tirzono/helm-charts
sources:
  - https://github.com/tirzono/helm-charts/tree/master/charts/example-app
keywords:
  - example
maintainers:
  - name: tirzono
    url: https://github.com/tirzono
